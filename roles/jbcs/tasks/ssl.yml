---
- name: Check preconditions
  ansible.builtin.assert:
    that:
      - httpd is defined
      - httpd.home is defined
    quiet: true

- name: Path for SSL enabled
  ansible.builtin.set_fact:
    jbcs_ssl_conf: "{{ httpd.home }}/httpd/conf.d/ssl.conf"

- name: Path for SSL disabled
  ansible.builtin.set_fact:
    jbcs_ssl_conf_disabled: "{{ jbcs_ssl_conf }}.disabled"

- name: Check existence of SSL configuration
  ansible.builtin.stat:
    path: "{{ jbcs_ssl_conf }}"
  register: jbcs_ssl_conf_file

- name: Check existence of disabled SSL configuration
  ansible.builtin.stat:
    path: "{{ jbcs_ssl_conf_disabled }}"
  register: jbcs_ssl_conf_disabled_file

- name: Disable SSL tasks
  become: "{{ jbcs_requires_become }}"
  when: not jbcs_ssl_enable
  block:
    - name: "Disabled SSL"
      ansible.builtin.file:
        src: "{{ jbcs_ssl_conf }}"
        path: "{{ jbcs_ssl_conf }}.disabled"
        state: hard
        owner: "{{ httpd.user.name }}"
        group: "{{ httpd.group.name }}"
        mode: '0640'
      when:
        - jbcs_ssl_conf_file.stat.exists
        - not jbcs_ssl_conf_disabled_file.stat.exists

    - name: "Remove SSL configuration"
      ansible.builtin.file:
        path: "{{ jbcs_ssl_conf }}"
        state: absent

- name: Enable SSL tasks
  become: "{{ jbcs_requires_become }}"
  when: jbcs_ssl_enable
  block:
    - name: Check if SSL certificate exists
      ansible.builtin.stat:
        path: "/etc/pki/tls/certs/{{ jbcs_external_domain_name }}.crt"
      register: jbcs_ssl_cert_file

    - name: Create self-signed SSL certificate if missing
      ansible.builtin.command: >
        openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes
        -keyout /etc/pki/tls/private/{{ jbcs_external_domain_name }}.key
        -out /etc/pki/tls/certs/{{ jbcs_external_domain_name }}.crt
        -subj "/CN={{ jbcs_external_domain_name }}"
        -addext "subjectAltName=DNS:{{ jbcs_external_domain_name }},IP:127.0.0.1"
      when: not jbcs_ssl_cert_file.stat.exists
      changed_when: true

    - name: "Ensures HTTPd SSL configuration is deployed"
      ansible.builtin.template:
        src: templates/ssl.conf.j2
        dest: "{{ jbcs_ssl_conf }}"
        owner: "{{ httpd.user.name }}"
        group: "{{ httpd.group.name }}"
        mode: '0640'
      notify:
        - Restart JBCS

    - name: "Remove disabled conf if exists"
      ansible.builtin.file:
        path: "{{ jbcs_ssl_conf_disabled }}"
        state: absent
      when:
        - jbcs_ssl_conf_disabled_file.stat.exists
