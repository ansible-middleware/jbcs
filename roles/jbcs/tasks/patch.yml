---
- name: Download JBCS patch from RHN using Unified Downloads
  delegate_to: localhost
  run_once: true
  when:
    - not jbcs_offline_install
    - rhn_username is defined and rhn_password is defined
  block:
    - name: Retrieve product download using Unified Downloads
      middleware_automation.common.product_search:
        client_id: "{{ rhn_username }}"
        client_secret: "{{ rhn_password }}"
        product_type: SECURITY
        product_version: "{{ jbcs_version.split('.')[:2] | join('.') }}"
        product_category: "CORE.SERVICE.APACHEHTTP"
      register: jbcs_rhn_products
      delegate_to: localhost
      run_once: true

    - name: Convert results to list if dict
      ansible.builtin.set_fact:
        jbcs_rhn_products_list: >-
          {{ (jbcs_rhn_products.results | dict2items | map(attribute='value') | list)
             if jbcs_rhn_products.results is mapping else jbcs_rhn_products.results }}
      delegate_to: localhost
      run_once: true

    - name: Determine patch zipfiles from search results
      ansible.builtin.set_fact:
        jbcs_rhn_filtered_products: "{{ jbcs_rhn_products_list | map(attribute='file_name') | \
                                   select('match', '^[^/]*/' + jbcs_patch_bundle + '$') | \
                                   map('regex_replace', '[^/]*/' + jbcs_bundle_prefix + '-' + jbcs_version + '-SP([1-9][0-9]*)-.*', '\\1') | \
                                   list | unique }}"
      delegate_to: localhost
      run_once: true

    - name: Sort patch versions
      ansible.builtin.set_fact:
        jbcs_latest_patch_version: "{{ 'SP' + (jbcs_rhn_filtered_products | middleware_automation.common.version_sort | last) }}"
      delegate_to: localhost
      run_once: true

    - name: Determine latest patch version
      ansible.builtin.set_fact:
        jbcs_rhn_filtered_products: "{{ jbcs_rhn_products_list | selectattr('file_name', 'match', \
                                   '[^/]*/' + [ jbcs_bundle_prefix, jbcs_version, jbcs_latest_patch_version, jbcs_distro, jbcs_arch ] | join('-') + '.zip$') }}"
      delegate_to: localhost
      run_once: true

    - name: Determine patch archive filename
      ansible.builtin.set_fact:
        jbcs_patch_bundle: "{{ (jbcs_rhn_filtered_products | first).file_name | basename }}"
      delegate_to: localhost
      run_once: true

    - name: Download JBCS patch
      middleware_automation.common.product_download:
        client_id: "{{ rhn_username }}"
        client_secret: "{{ rhn_password }}"
        product_id: "{{ (jbcs_rhn_filtered_products | first).id }}"
        dest: "{{ jbcs_local_path.stat.path }}/{{ jbcs_patch_bundle }}"
      no_log: "{{ omit_rhn_output | default(true) }}"
      delegate_to: localhost
      run_once: true

- name: Use provided JBCS patch archive for offline install
  delegate_to: localhost
  when:
    - jbcs_offline_install
    - '"[1-9][0-9]" in jbcs_patch_bundle'
  block:

    - name: Initialize candidates list
      delegate_to: localhost
      ansible.builtin.set_fact:
        jbcs_sp_archive_candidates: []

    - name: Find local SP archive(s)
      run_once: true
      with_fileglob:
        - "{{ jbcs_local_path.stat.path }}/{{ jbcs_patch_bundle.replace('[1-9][0-9]', '') }}"
      ansible.builtin.set_fact:
        jbcs_sp_archive_candidates: "{{ jbcs_sp_archive_candidates + [item | basename] }}"
      delegate_to: localhost

    - name: Process candidates and pick the newest Service Pack
      delegate_to: localhost
      when: jbcs_sp_archive_candidates | length > 0
      vars:
        jbcs_prefix: "{{ jbcs_bundle_prefix }}-{{ jbcs_version }}-SP"
        jbcs_suffix: "-{{ jbcs_distro }}-{{ jbcs_arch }}.zip"
      ansible.builtin.set_fact:
        jbcs_newest_sp: "{{ jbcs_sp_archive_candidates | \
                       map('replace', jbcs_prefix, '') | \
                       map('replace', jbcs_suffix, '')  | \
                       map('int') | sort | last }}"

    - name: "Use SP {{ jbcs_newest_sp }}"
      when: jbcs_newest_sp is defined
      ansible.builtin.set_fact:
        jbcs_patch_bundle: "{{ jbcs_bundle_prefix }}-{{ jbcs_version }}-SP{{ jbcs_newest_sp }}-{{ jbcs_distro }}-{{ jbcs_arch }}.zip"

- name: Check local download archive
  ansible.builtin.stat:
    path: "{{ jbcs_local_path.stat.path }}/{{ jbcs_patch_bundle }}"
  register: jbcs_local_archive_path
  delegate_to: localhost

## check remote archive
- name: Set download archive path
  ansible.builtin.set_fact:
    jbcs_archive: "{{ jbcs_zip_path }}/{{ jbcs_patch_bundle }}"

- name: Check download archive path
  become: "{{ jbcs_requires_become }}"
  ansible.builtin.stat:
    path: "{{ jbcs_archive }}"
  register: jbcs_archive_path

## copy and unpack
- name: Copy archive to target nodes
  ansible.builtin.copy:
    src: "{{ jbcs_local_path.stat.path }}/{{ jbcs_patch_bundle }}"
    dest: "{{ jbcs_archive }}"
    owner: "{{ httpd.user.name }}"
    group: "{{ httpd.group.name }}"
    mode: '0640'
  register: jbcs_new_version_downloaded
  when:
    - not jbcs_archive_path.stat.exists
    - jbcs_local_archive_path.stat is defined
    - jbcs_local_archive_path.stat.exists
  become: "{{ jbcs_requires_become }}"

- name: "Check target directory: {{ httpd.home }}"
  ansible.builtin.stat:
    path: "{{ httpd.home }}"
  register: jbcs_path_to_workdir
  become: "{{ jbcs_requires_become }}"

- name: Extract JBCS patch archive on target
  ansible.builtin.unarchive:
    remote_src: true
    src: "{{ jbcs_archive }}"
    dest: /opt/jbcs/
    owner: "{{ httpd.user.name }}"
    group: "{{ httpd.group.name }}"
  become: "{{ jbcs_requires_become }}"
  when:
    - jbcs_new_version_downloaded.changed or jbcs_path_to_workdir is not defined or not jbcs_path_to_workdir.stat.exists
  notify:
    - Restart JBCS

- name: Inform decompression was not executed
  ansible.builtin.debug:
    msg: "{{ httpd.home }} already exists and version unchanged, skipping decompression"
  when:
    - not jbcs_new_version_downloaded.changed
    - jbcs_path_to_workdir is defined
    - jbcs_path_to_workdir.stat.exists
