---
- name: "Check if packages are already installed" # noqa command-instead-of-module this runs faster
  ansible.builtin.command: "rpm -q {{ packages_list | join(' ') }}"
  register: jbcs_rpm_info
  changed_when: false
  failed_when: false

- name: "Add missing packages to the yum install list"
  ansible.builtin.set_fact:
    jbcs_packages_to_install: >-
      {{ jbcs_packages_to_install | default([])
         + jbcs_rpm_info.stdout_lines
         | map('regex_findall', 'package (.+) is not installed$')
         | default([]) | flatten }}

- name: "Install packages: {{ jbcs_packages_to_install }}"
  become: "{{ jbcs_requires_become }}"
  ansible.builtin.dnf:
    name: "{{ jbcs_packages_to_install }}"
    state: present
  when: jbcs_packages_to_install | default([]) | length > 0
